name: Build Android APK and release it

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Build Android APK with EAS
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured." >&2
            exit 1
          fi
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json

      - name: Download APK
        run: |
          build_url="$(node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync("eas-build.json", "utf8"));
            const build = Array.isArray(value) ? value[0] : value;
            const url = build?.artifacts?.buildUrl || build?.artifactUrl;
            if (!url) process.exit(1);
            process.stdout.write(url);
          ')"
          curl --fail --location --retry 3 "$build_url" --output PSrepo.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="android-${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$release_tag" PSrepo.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "PSrepo $release_tag" \
            --generate-notes
